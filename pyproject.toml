[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerfile-lint"
version = "0.1.3"
description = "Offline Dockerfile hygiene and security checks: unpinned images, root user, curl-pipe-shell, secrets in ENV."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
dockerfile-lint = "dockerfile_lint.cli:main"
